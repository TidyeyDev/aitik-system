<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

      // Apply the saved theme before first paint (key matches ThemeContext.jsx).

          document.documentElement.classList.add("dark");
      } catch {}
